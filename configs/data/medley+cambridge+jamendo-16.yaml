data:
  class_path: mst.dataloader.MultitrackDataModule
  init_args:
    track_root_dirs: 
      - /import/c4dm-datasets-ext/mixing-secrets/
      - /import/c4dm-datasets/
    mix_root_dirs:  
      - /import/c4dm-scratch-02/MTG-jamendo-wav
    metadata_files: 
      - ./data/cambridge.yaml 
      - ./data/medley.yaml
    length: 262144
    min_tracks: 4
    max_tracks: 12
    batch_size: 1
    num_workers: 1
    num_train_passes: 5
    num_val_passes: 1
    train_buffer_size_gb: 0.01
    val_buffer_size_gb: 0.001
    target_track_lufs_db: -48.0
    randomize_ref_mix_gain: true
    num_train_examples: 250
    num_val_examples: 100